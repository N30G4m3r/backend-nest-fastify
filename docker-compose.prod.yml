services:
  backend-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: backend-prod
    restart: always
    env_file:
      - path: .env.prod
        required: false
      - path: .env.prod.example
        required: false
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3000}
    ports:
      - "${HOST_PORT:-3000}:${PORT:-3000}"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${PORT:-3000}/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
        delay: 5s
