services:
  backend-qa:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: backend-qa
    restart: unless-stopped
    env_file:
      - path: .env.qa
        required: false
      - path: .env.qa.example
        required: false
    environment:
      - NODE_ENV=${NODE_ENV:-qa}
      - PORT=${PORT:-3000}
    ports:
      - "${HOST_PORT:-4000}:${PORT:-3000}"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${PORT:-3000}/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
